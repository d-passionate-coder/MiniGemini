spring:
  application:
    name: chat-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update         # auto creates tables on startup
    show-sql: true             # prints SQL queries in console
    properties:
      hibernate:
        format_sql: true       # makes printed SQL readable
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET}
  expiryMinutes: 60

gemini:
  api:
    url: https://generativelanguage.googleapis.com
    key: ${GEMINI_API_KEY}
    version: v1beta
    model: gemini-2.5-flash

server:
  error:
    include-message: always    # ← shows exception message in error response
    include-binding-errors: always
  port: ${PORT:8082}

