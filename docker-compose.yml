version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: minigemini-db
    env_file:
      - .env
    expose:
      - "5432" # only visible inside Docker network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - minigemini-network

  auth-service:
    build: ./auth-service
    container_name: auth-service
    expose:
      - "8081" # not exposed to host, only gateway can reach it
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - minigemini-network

  chat-service:
    build: ./chat-service
    container_name: chat-service
    expose:
      - "8082" # not exposed to host, only gateway can reach it
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - minigemini-network

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080" # only this is exposed to the outside world
    env_file:
      - .env
    depends_on:
      - auth-service
      - chat-service
    networks:
      - minigemini-network

networks:
  minigemini-network:
    driver: bridge

volumes:
  postgres_data:
